{% extends "admin/base.html" %}
{% block title %}Change Password | Admin{% endblock %}
{% block admin_content %}
<h2>Change Admin Password</h2>
<div class="card form-card" style="margin:0;max-width:600px">
<form method="post">
<label>Current password</label><input name="current_password" type="password" required>
<label>New password</label><input name="new_password" type="password" minlength="8" required>
<label>Confirm new password</label><input name="confirm_password" type="password" minlength="8" required>
<button class="btn btn-primary" style="margin-top:15px">Change Password</button>
</form>
</div>
{% endblock %}
