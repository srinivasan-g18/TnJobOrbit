{% extends "admin/base.html" %}
{% block title %}Tests | Admin{% endblock %}
{% block admin_content %}
<h2>Mock Tests</h2>
<div class="card"><form method="post">
<div class="two"><div><label>Test title *</label><input name="title" required></div><div><label>Subject</label><input name="subject"></div></div>
<div class="three"><div><label>Category</label><select name="category"><option value="">Select</option>{% for c in categories %}<option>{{ c.name }}</option>{% endfor %}</select></div><div><label>Duration (minutes)</label><input name="duration_minutes" type="number" min="1" value="30"></div><div><label>Difficulty</label><select name="difficulty"><option>Easy</option><option selected>Medium</option><option>Hard</option></select></div></div>
<div class="two"><div><label>Marks/question</label><input name="marks_per_question" type="number" step="0.25" value="1"></div><div><label>Negative marks</label><input name="negative_marks" type="number" step="0.25" value="0"></div></div>
<label>Description</label><textarea name="description"></textarea>
<button class="btn btn-orange">Create Test & Add Questions</button>
</form></div>
<h3 style="margin-top:30px">All Tests</h3><div class="table-wrap"><table><tr><th>Test</th><th>Questions</th><th>Status</th><th>Actions</th></tr>
{% for x in tests %}
<tr><td><strong>{{ x.title }}</strong><br><span class="muted">{{ x.category }} • {{ x.subject }}</span></td><td><a class="btn btn-light btn-small" href="{{ url_for('admin_test_questions',test_id=x.id) }}">Manage Questions</a></td><td>{{ x.status }}</td><td><form style="display:inline" method="post" action="{{ url_for('admin_test_toggle',test_id=x.id) }}"><button class="btn btn-light btn-small">Toggle</button></form> <form style="display:inline" method="post" action="{{ url_for('admin_test_delete',test_id=x.id) }}" onsubmit="return confirm('Permanently delete this test and all questions?')"><button class="btn btn-danger btn-small">Delete</button></form></td></tr>
{% endfor %}
</table></div>
{% endblock %}
